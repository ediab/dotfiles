# --- Mobile-friendly tmux config ---

# True color (24-bit) passthrough. Without this tmux downsamples 24-bit SGR to the
# nearest 256-color slot, so the Catppuccin Mocha hexes in ~/.p10k.zsh would render
# as approximate greens/blues instead of the real palette. The outer terminal must
# support true color (Ghostty does).
set -ag terminal-overrides ",*:RGB"

# Enable mouse support (scroll, resize panes, select windows)
set -g mouse on

# Prefix: Ctrl+A instead of Ctrl+B (easier one-handed on mobile)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Status bar: top, trimmed for narrow (iPhone-width) terminals
set -g status-position top
set -g status-left-length 20
set -g status-right-length 20
set -g status-left "#S"
set -g status-right "%H:%M"

# Mobile layout: stacked horizontal panes, bound to prefix + M
bind M select-layout main-horizontal
set -g extended-keys on
