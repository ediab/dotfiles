# ==============================================================================
# --- GHOSTTY & TERMINAL OPTIMIZATIONS ---
# ==============================================================================

# Enable True Color and RGB support (Crucial for Ghostty themes)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# Enable Undercurl support (squiggly lines for Neovim/LSP)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setbe=\E[58:2::%p1%{65536}%/%d:%p1%{256}%/%g%{255}%&%d:%p1%{255}%&%d%m'

# Quality of Life Tweaks
set -s escape-time 0           # No lag for ESC (Vim/CLI tools)
set -g history-limit 200000    # Massive scrollback for agent output
set -g mouse on               # Mouse/Trackpad support
set -g focus-events on         # Let Ghostty notify tmux on focus
set -g renumber-windows on     # Keep window numbers sequential (1, 2, 3...)
set -g base-index 1            # Start windows at 1 (easier to reach)
setw -g pane-base-index 1      # Start panes at 1

# --- pi key handling ---
set -g extended-keys on
set -g extended-keys-format csi-u

# --- terminal capabilities ---
set -ga terminal-features ",*:RGB,*:clipboard,*:hyperlinks"

# --- clipboard + OSC passthrough (agents emit OSC 52 / OSC 777) ---
set -g allow-passthrough on
set -g set-clipboard on

# --- knowing when a child agent finishes ---
set -g monitor-bell on
set -g bell-action any
set -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style 'fg=yellow'
setw -g window-status-bell-style     'fg=red,bold'

# --- subagent window/pane hygiene ---
setw -g automatic-rename off
set -g allow-rename off
set -g remain-on-exit failed
set -g destroy-unattached off
set -g pane-border-status top
set -g pane-border-format " #{pane_index} #{pane_current_command} "

# ==============================================================================
# --- ERGONOMICS & KEYBINDINGS ---
# ==============================================================================

# Remap prefix to Ctrl-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# Better Window Splitting (Preserve current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Smart Pane Navigation (Vim-style h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Fast Pane Resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Vi-style copy mode (matches hjkl nav; v select, y yank w/ tmux-yank)
setw -g mode-keys vi

# Reload Config Shortcut
bind r source-file ~/.tmux.conf \; display "✨ Config Reloaded!"

# --- AGENT FORKING POPUP ---
# Optimized for Ghostty's rounded borders
bind f display-popup -E -w 80% -h 60% -b rounded "~/fork-agent.sh"

# ==============================================================================
# --- VISUALS (TRANSPARENT / GHOSTTY THEME) ---
# ==============================================================================

# Status bar transparent (Inherits Ghostty background)
set -g status-style bg=default
set -g status-left-length 40
set -g status-left "#[fg=blue,bold]   #S #[fg=white,nobold] "
set -g status-right "#[fg=brightblack]%H:%M #[fg=magenta]#[fg=black,bg=magenta]󰭦 #[fg=black,bg=magenta,bold]Ghostty#[fg=magenta,bg=default] "

# Highlight active window
set-window-option -g window-status-current-style fg=magenta,bold
set-window-option -g window-status-style fg=brightblack

# ==============================================================================
# --- PLUGIN MANAGEMENT (TPM) ---
# ==============================================================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'tmux-plugins/tmux-logging'
set -g @plugin 'Morantron/tmux-fingers'

# Plugin Configs
set -g @sidebar-tree-command 'tree -C -L 2'
set -g @continuum-restore 'on'  # Auto-restore session on boot/start
set -g @resurrect-capture-pane-contents 'on'

# Initialize TPM (Keep this at the very bottom)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'